# Compose for Dokploy (or any host that already runs Traefik on 80/443).
# No Caddy and no published ports: Dokploy's Traefik routes the domain to port 3000.
services:
  weelink:
    build:
      context: .
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WEELINK_SECRET: ${WEELINK_SECRET:?Isi WEELINK_SECRET di tab Environment Dokploy}
      YTDLP_AUTO_UPDATE: ${YTDLP_AUTO_UPDATE:-1}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      COMPAT_TRANSCODE: ${COMPAT_TRANSCODE:-1}
      THREADS_RENDER: ${THREADS_RENDER:-1}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-10800}
      RESOLVE_LIMIT_PER_10_MIN: ${RESOLVE_LIMIT_PER_10_MIN:-30}
      DOWNLOAD_LIMIT_PER_10_MIN: ${DOWNLOAD_LIMIT_PER_10_MIN:-30}
    deploy:
      resources:
        limits:
          cpus: "${WEELINK_CPUS:-2}"
          memory: ${WEELINK_MEMORY:-2g}
